# Container web: phục vụ bản build của giao diện và chuyển /api/* sang container api.
# Giao diện và API cùng một origin nên không cần CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Dấu / cuối proxy_pass bỏ tiền tố /api: /api/auth/login -> http://api:8000/auth/login
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Ứng dụng một trang: đường dẫn nào không phải file thì trả index.html để React Router xử lý
    location / {
        try_files $uri /index.html;
    }
}
