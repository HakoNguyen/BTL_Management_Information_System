name: ci
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # tests/conftest.py tự tạo CSDL qlbh_test và chạy migration
      TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/qlbh_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: web
      # Kiểu TypeScript phải khớp OpenAPI của api: quên chạy make gen-api thì bước này đỏ
      - run: make gen-api
      - run: git diff --exit-code web/src/api/schema.d.ts
      - run: make web-check
